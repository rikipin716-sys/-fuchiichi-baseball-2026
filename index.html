<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>不知火一ベースボール 2026 戦績ダッシュボード</title>

    <script>
      // Chart.js に依存するスクリプトが先に動かないようにするため、
      // ここでは外部 CDN を安全に読み込む。
      window.addEventListener('DOMContentLoaded', function () {
        if (typeof Chart === 'undefined') {
          console.warn('Chart.js not loaded yet. Retrying...');
          setTimeout(function () {
            if (typeof Chart !== 'undefined') {
              renderDashboard();
            } else {
              document.body.insertAdjacentHTML(
                'beforeend',
                '<div style="padding:24px;color:#c00;font-weight:700;">Chart.js の読み込みに失敗しました。ネット���ーク接続と CDN の状態を確認してください。</div>'
              );
            }
          }, 500);
        } else {
          renderDashboard();
        }
      });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>

    <style>
      :root {
        --bg: #eaf0f8;
        --panel: #ffffff;
        --header1: #1f3a6e;
        --header2: #3d6ad0;
        --text: #1a2433;
        --muted: #58708d;
        --line: #dfe7f3;
        --green: #2ea86a;
        --red: #e94f4f;
        --amber: #f3b336;
        --blue: #3d6ad0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--header1), var(--header2));
        color: white;
        box-shadow: 0 8px 22px rgba(16, 35, 80, 0.12);
      }

      .title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .title h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 2.2rem);
        line-height: 1.2;
      }

      .title small {
        font-size: 0.9rem;
        opacity: 0.9;
      }

      .theme-toggle {
        border: none;
        background: rgba(255,255,255,0.18);
        color: white;
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 1.1rem;
        cursor: pointer;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 18px;
      }

      .card {
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 6px 18px rgba(20, 32, 58, 0.08);
        padding: 18px;
      }

      .mini-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .mini-panel .label {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .mini-panel .value {
        font-size: clamp(1.4rem, 3vw, 2.3rem);
        line-height: 1.1;
        font-weight: 800;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      .chart-box {
        background: var(--panel);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 6px 18px rgba(20, 32, 58, 0.08);
      }

      .chart-box h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .chart-box canvas {
        display: block;
        width: 100% !important;
        height: 260px !important;
      }

      .note {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="title">
          <h1>⚾ 不知火一ベースボール 2026</h1>
          <small>戦績ダッシュボード</small>
        </div>
        <button class="theme-toggle" type="button" aria-label="テーマ切替">🌙</button>
      </header>

      <section class="stats">
        <div class="card mini-panel">
          <div>
            <div class="label">総試合数</div>
            <div class="value" id="totalGames">0</div>
          </div>
        </div>
        <div class="card mini-panel">
          <div>
            <div class="label">勝利</div>
            <div class="value" id="wins">0</div>
          </div>
        </div>
        <div class="card mini-panel">
          <div>
            <div class="label">敗北</div>
            <div class="value" id="losses">0</div>
          </div>
        </div>
        <div class="card mini-panel">
          <div>
            <div class="label">勝率</div>
            <div class="value" id="winRate">0%</div>
          </div>
        </div>
      </section>

      <section class="chart-grid">
        <div class="chart-box">
          <h2>勝敗推移</h2>
          <canvas id="lineChart"></canvas>
        </div>
        <div class="chart-box">
          <h2>勝敗内訳</h2>
          <canvas id="doughnutChart"></canvas>
        </div>
        <div class="chart-box">
          <h2>月別得点 / 失点</h2>
          <canvas id="barChart"></canvas>
        </div>
      </section>

      <div class="note">GitHub Pages で Chart.js を安定して表示するように修正済みです。</div>
    </div>

    <script>
      function renderDashboard() {
        if (typeof Chart === 'undefined') {
          console.error('Chart.js is not defined.');
          return;
        }

        const results = [
          { month: '4月', wins: 2, losses: 1, runs: 18, allowed: 12 },
          { month: '5月', wins: 3, losses: 2, runs: 26, allowed: 21 },
          { month: '6月', wins: 4, losses: 1, runs: 32, allowed: 20 },
          { month: '7月', wins: 3, losses: 2, runs: 27, allowed: 24 },
          { month: '8月', wins: 5, losses: 1, runs: 38, allowed: 19 },
          { month: '9月', wins: 4, losses: 2, runs: 35, allowed: 26 }
        ];

        const totalGames = results.reduce((sum, item) => sum + item.wins + item.losses, 0);
        const totalWins = results.reduce((sum, item) => sum + item.wins, 0);
        const totalLosses = results.reduce((sum, item) => sum + item.losses, 0);
        const winRate = totalGames ? ((totalWins / totalGames) * 100).toFixed(1) : '0.0';

        document.getElementById('totalGames').textContent = totalGames;
        document.getElementById('wins').textContent = totalWins;
        document.getElementById('losses').textContent = totalLosses;
        document.getElementById('winRate').textContent = winRate + '%';

        const cumulative = [];
        let running = 0;
        results.forEach((entry) => {
          running += entry.wins - entry.losses;
          cumulative.push(running);
        });

        new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
            labels: results.map((item) => item.month),
            datasets: [{
              label: '勝利数 - 敗北数',
              data: cumulative,
              borderColor: '#3d6ad0',
              backgroundColor: 'rgba(61, 106, 208, 0.12)',
              borderWidth: 3,
              tension: 0.35,
              fill: true,
              pointRadius: 4,
              pointBackgroundColor: '#3d6ad0'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: {
                beginAtZero: false,
                grid: { color: '#e7edf7' }
              },
              x: {
                grid: { display: false }
              }
            }
          }
        });

        new Chart(document.getElementById('doughnutChart'), {
          type: 'doughnut',
          data: {
            labels: ['勝利', '敗北'],
            datasets: [{
              data: [totalWins, totalLosses],
              backgroundColor: ['#2ea86a', '#e94f4f'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom'
              }
            }
          }
        });

        new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: {
            labels: results.map((item) => item.month),
            datasets: [
              {
                label: '得点',
                data: results.map((item) => item.runs),
                backgroundColor: '#3d6ad0'
              },
              {
                label: '失点',
                data: results.map((item) => item.allowed),
                backgroundColor: '#e94f4f'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: '#e7edf7' }
              },
              x: {
                grid: { display: false }
              }
            }
          }
        });

        const toggleButton = document.querySelector('.theme-toggle');
        toggleButton.addEventListener('click', () => {
          const root = document.documentElement;
          const current = root.style.getPropertyValue('--bg');
          if (current === '#0f1729') {
            root.style.setProperty('--bg', '#eaf0f8');
            root.style.setProperty('--panel', '#ffffff');
            root.style.setProperty('--text', '#1a2433');
            root.style.setProperty('--muted', '#58708d');
            toggleButton.textContent = '🌙';
          } else {
            root.style.setProperty('--bg', '#0f1729');
            root.style.setProperty('--panel', '#1b2431');
            root.style.setProperty('--text', '#edf4ff');
            root.style.setProperty('--muted', '#a8bed8');
            toggleButton.textContent = '☀️';
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderDashboard);
      } else {
        renderDashboard();
      }
    </script>
  </body>
</html>
