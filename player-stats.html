<!DOCTYPE html><html lang="ja" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--w:#10c98f;--l:#ff5d73;--d:#ffb547;--navy:#3b5bdb;--ac:#5b8cff;--ac2:#8b5cf6;--bg:#eef1f8;--card:rgba(255,255,255,.74);--solid:#fff;--ctl:rgba(238,241,248,.78);--tx:#0f172a;--mu:#64748b;--bd:rgba(15,23,42,.09);--hv:rgba(91,140,255,.09);--sel:rgba(91,140,255,.16);--sh:0 10px 30px rgba(30,50,120,.10)}
[data-theme=dark]{--navy:#8fb0ff;--ac:#6b9bff;--bg:#060a14;--card:rgba(22,30,50,.62);--solid:#111a2e;--ctl:rgba(6,10,20,.72);--tx:#e8eefb;--mu:#8e9db8;--bd:rgba(148,163,184,.15);--hv:rgba(107,155,255,.11);--sel:rgba(107,155,255,.2);--sh:0 12px 36px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 8% -8%,rgba(91,140,255,.28),transparent 70%),radial-gradient(560px 420px at 100% 8%,rgba(139,92,246,.22),transparent 70%),radial-gradient(700px 520px at 55% 115%,rgba(34,211,238,.13),transparent 70%)}
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#0a1744 0%,#2547c8 48%,#7a4dff 100%);color:#fff;padding:30px 24px 34px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-radius:0 0 30px 30px;box-shadow:0 16px 40px rgba(37,71,200,.35)}
header::before,header::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
header::before{width:340px;height:340px;right:-80px;top:-160px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%)}
header::after{width:260px;height:260px;left:30%;bottom:-170px;background:radial-gradient(circle,rgba(34,211,238,.4),transparent 70%)}
header>*{position:relative;z-index:1}
header h1{margin:0;font-size:27px;font-weight:800;letter-spacing:.02em;line-height:1.25}
header h1::before{content:"SEASON 2026";display:block;font-size:11px;font-weight:700;letter-spacing:.28em;opacity:.7;margin-bottom:6px}
header p{margin:6px 0 0;opacity:.82;font-size:12px}
.ic{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;white-space:nowrap}
.ic:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.ctl{position:sticky;top:0;z-index:20;background:var(--ctl);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);padding:12px 16px;border-bottom:1px solid var(--bd)}
.ctl>div{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;background:var(--hv);border:1px solid var(--bd);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:9px 20px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--mu);font-weight:700;transition:.2s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 18px rgba(91,140,255,.45)}
select,input,textarea{padding:10px 14px;border-radius:14px;border:1px solid var(--bd);font-size:14px;background:var(--solid);color:var(--tx);outline:none;transition:.2s}
select:focus,input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--sel)}
.rs{margin-left:auto;border:0;background:none;color:var(--ac);cursor:pointer;font-size:13px;font-weight:700}
main{max-width:1120px;margin:0 auto;padding:22px 16px 40px}
.hero{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s;animation:up .5s both}
.card:hover{transform:translateY(-2px)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 14px;font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--tx);display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
.big{display:flex;align-items:center;gap:16px}.big .cv{width:170px;height:170px;flex:none}
.rec{font-size:34px;font-weight:800;line-height:1.2;background:linear-gradient(90deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.rec small{font-size:13px;font-weight:600;display:block;color:var(--mu);-webkit-text-fill-color:var(--mu);margin-top:2px}
.form{margin-top:12px;font-size:12px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:100%}
.k{background:linear-gradient(160deg,var(--hv),transparent);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.k span{font-size:12px;color:var(--mu);font-weight:600}
.k b{display:block;font-size:30px;font-weight:800;line-height:1.2;background:linear-gradient(135deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.k i{font-style:normal;font-size:11px;color:var(--mu)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.h{background:var(--card);backdrop-filter:blur(14px);border:0;border-left:5px solid var(--ac);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.h::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,var(--hv),transparent 70%)}
.h span{font-size:12px;color:var(--mu);font-weight:600}.h b{display:block;font-size:21px;font-weight:800}.h i{font-style:normal;font-size:12px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}.wide{grid-column:1/-1}
.cv{position:relative;height:260px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.t{border:2px solid transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(var(--bd),var(--bd)) border-box;border-radius:16px;padding:12px 14px;cursor:pointer;font-size:13px;transition:.2s}
.t.on{background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box;box-shadow:0 8px 24px rgba(91,140,255,.3)}
.t:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(91,140,255,.22)}
.t b{display:block;font-size:14px}.t em{font-style:normal;font-weight:800;color:var(--navy);display:block;min-height:19px}.t i{font-style:normal;color:var(--mu);font-size:12px}
.pb{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:8px 0 6px;background:var(--bd)}.pb u{display:block}
.tb2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--solid);color:var(--tx);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s}
.chip:hover{border-color:var(--ac)}.chip.on{color:#fff;border-color:transparent}
.chip[data-r="○"].on{background:var(--w);box-shadow:0 4px 14px rgba(16,201,143,.45)}.chip[data-r="●"].on{background:var(--l);box-shadow:0 4px 14px rgba(255,93,115,.45)}.chip[data-r="△"].on{background:var(--d);box-shadow:0 4px 14px rgba(255,181,71,.45)}
.tw{max-height:480px;overflow:auto;border:1px solid var(--bd);border-radius:16px;background:var(--solid)}
table{width:100%;min-width:900px;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--solid)}
th{position:sticky;top:0;z-index:3;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;user-select:none}th:hover{color:var(--ac)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}th:first-child{z-index:4}
tbody tr:nth-child(even) td{background:linear-gradient(var(--hv),var(--hv)),var(--solid)}
tbody tr:hover td{background:linear-gradient(var(--sel),var(--sel)),var(--solid)}
td.o{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.sc{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.bd{display:inline-block;min-width:30px;text-align:center;border-radius:999px;color:#fff;font-weight:800;padding:2px 9px}
.bd.○{background:linear-gradient(135deg,#10c98f,#0ea5a0);box-shadow:0 3px 10px rgba(16,201,143,.4)}.bd.●{background:linear-gradient(135deg,#ff5d73,#ff3d6e);box-shadow:0 3px 10px rgba(255,93,115,.4)}.bd.△{background:linear-gradient(135deg,#ffb547,#ff9a3c);box-shadow:0 3px 10px rgba(255,181,71,.4)}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--sel);color:var(--navy);font-weight:700}.tag.p{background:rgba(255,181,71,.18);color:var(--d)}
.empty{padding:34px;text-align:center;color:var(--mu)}.note{font-size:12px;color:var(--mu)}
.eo{display:none}body.edit .eo{display:table-cell}.eb{display:none}body.edit .eb{display:inline-block}
.add{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 8px 20px rgba(91,140,255,.4);transition:.2s}
.add:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(91,140,255,.5)}.add:disabled{opacity:.6}
.mini{border:1px solid var(--bd);background:var(--solid);color:var(--tx);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}.mini:hover{border-color:var(--ac);color:var(--ac)}.mini.del{color:var(--l)}
.ov{position:fixed;inset:0;background:rgba(4,8,20,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.ov.on{display:flex}
.md{background:var(--solid);border:1px solid var(--bd);border-radius:24px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:up .3s both}.md h3{margin:0 0 14px;color:var(--tx);font-size:17px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px;font-weight:700}.fg .full{grid-column:1/-1}.fg input,.fg select{font-weight:400;width:100%}
.pv{margin:14px 0;padding:12px;background:var(--hv);border:1px solid var(--bd);border-radius:14px;font-size:14px;text-align:center}.acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(10,16,32,.92);backdrop-filter:blur(10px);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:60;border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 30px rgba(0,0,0,.4)}.toast.on{opacity:1}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.kp{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{padding:22px 16px 26px;border-radius:0 0 24px 24px}header h1{font-size:19px}.seg button{padding:9px 14px}.big .cv{width:140px;height:140px}.rec{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

tbody tr{cursor:pointer}tbody tr.sel td{background:linear-gradient(var(--sel),var(--sel)),var(--solid)!important;font-weight:700}
.q{opacity:.4}.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--sel);color:var(--navy);font-size:11px;font-weight:700;margin:0 4px 4px 0}
.top{color:var(--ac);font-weight:800}.fg.n3{grid-template-columns:repeat(3,1fr)}@media(max-width:560px){.fg.n3{grid-template-columns:repeat(2,1fr)}}
header .ic:disabled{opacity:.6}a.ic{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
/* ヘッダー：タイトルを1行目いっぱいに、ボタンは下の段に折り返して並べる */
header{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:14px 16px}
header>div:first-child{flex:1 1 100%;min-width:0}
.hb{display:flex;flex-wrap:wrap;gap:8px;width:100%;flex:1 1 100%;justify-content:flex-start}

 cards([`防御率ランキング（${st.mins.p}回以上・低いほど良い）`,'奪三振と与四死球（投球回の多い順）','奪三振率 × 与四球率（9回あたり・左上ほど良い）','選手詳細（チーム平均との比較）','勝・敗・セーブ','学年別 投球回と奪三振']);

 radar(short(sel.name),ms.map(m=>sc(sel,m)),ms.map(m=>m[0]),ms.map(m=>Math.round(qq.reduce((s,p)=>s+sc(p,m),0)/qq.length)));

 const gs=['6年','5年','4年','3年','2年','1年'].filter(g=>R.some(p=>p.grade==g));
 bar('c6',gs,[{label:'投球回',data:gs.map(g=>+sum(R.filter(p=>p.grade==g),'ipd').toFixed(1)),backgroundColor:C.a},{label:'奪三振',data:gs.map(g=>sum(R.filter(p=>p.grade==g),'so')),backgroundColor:C.w}])}

function renderF(R,Q,sel){

 const m=st.mode,mi=MINS[m],cols=COLS[m],sk=st.sk[m],sd=st.sd[m];

 RENDER[m](R,Q,sel);
 const r=[...R].sort((a,b)=>{const x=a[sk],y=b[sk];return (x>y?1:x<y?-1:0)*sd});

$('th').onclick=()=>{const dk=document.documentElement.dataset.theme=='dark';document.documentElement.dataset.theme=dk?'':'dark';$('th').textContent=dk?'🌙 ダーク':'☀️ ライト';render()};
// ---------- 更新・編集（Googleスプレッドシート連携） ----------
const API_CONST='',CK='kisseki_players_cache2';
const API_URL=(()=>{let u='';try{const q=new URLSearchParams(location.search).get('api');if(q){localStorage.setItem('kisseki_players_api',q);u=q}else u=localStorage.getItem('kisseki_players_api')||''}catch(e){}return API_CONST||u})(),API=!!API_URL;
let TOKEN='',TEXP=0,editKey=null,tt,lastAt=0;
try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(API&&c&&c.b&&c.b.length)RECS=c}catch(e){}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function setList(r){if(!r||!r.b)return false;RECS={b:r.b,p:r.p||[],f:r.f||[]};lastAt=Date.now();try{localStorage.setItem(CK,JSON.stringify(RECS))}catch(e){}$('sync').textContent=' ／ 🔄 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' 更新';return true}
async function refresh(q){try{const r=await(await fetch(API_URL+'?action=list')).json();if(!setList(r))throw new Error('bad response');build();if(!q)render();return true}catch(e){console.error(e);toast('最新データを取得できませんでした（前回のデータを表示）');return false}}
async function rawPost(action,body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})});return r.json()}
async function apiPost(action,body){
 let r;try{r=await rawPost(action,{token:TOKEN,mode:st.mode,...body})}catch(e){console.error(e);toast('通信に失敗しました');throw e}
 if(r.b){setList(r);build();render()}
 if(r.ok)return r;
 if(r.error=='auth'){logout(true);toast('編集の有効期限が切れました。もう一度ログインしてください')}
 else if(r.error=='conflict')toast('他の人が先に更新しました。最新の内容を読み込みました。もう一度操作してください')
 else if(r.error=='notfound')toast('対象の選手が見つかりません。最新の内容を読み込みました')
 else toast(r.msg||'エラーが発生しました');
 throw new Error(r.error)}
const fv=k=>{const v=$('f_'+k).value;return v===''?0:+v};
function calcF(){const m=st.mode,o={name:'',grade:''};FLD[m].forEach(([k])=>o[k]=fv(k));
 if(m=='b'){const d=DER.b({...o,risp:0,sh:o.sh,sf:o.sf});$('pv').innerHTML=`安打 ${d.h} ／ 打席 ${d.pa} ／ 打率 ${f3(d.avg)} ／ 出塁率 ${f3(d.obp)} ／ 長打率 ${f3(d.slg)} ／ OPS ${f3(d.ops)}`+(d.h>o.ab?'<br><span style="color:var(--l)">安打数が打数を超えています</span>':'')}
 else if(m=='p'){const d=DER.p(o);$('pv').innerHTML=`${ipf(d.outs)}回 ／ 防御率 ${f2(d.era)} ／ WHIP ${f2(d.whip)} ／ 被打率 ${f3(d.ba)}`+(o.er>o.r?'<br><span style="color:var(--l)">自責点が失点を超えています</span>':'')}
 else $('pv').textContent='守備率・盗塁阻止率は 0〜1 の小数で入力します（例 0.875）'}
function openForm(no){
 const m=st.mode,x=no==null?null:RECS[m].find(r=>r.season==st.season&&r.no==no);editKey=x?{season:x.season,no:x.no,u:x.u}:null;

 $('fg2').innerHTML=FLD[m].map(([k,l,t])=>`<label>${l}<input type="number" id="f_${k}" min="0"${t=='rate'?' max="1" step="0.001"':t=='ip'?' step="0.1"':''} inputmode="decimal"></label>`).join('');
 $('f_season').value=x?x.season:st.season;$('f_name').value=x?x.name:'';$('f_no').value=x?x.no:'';$('f_grade').value=x?x.grade:'6年';
 FLD[m].forEach(([k])=>$('f_'+k).value=x?x[k]:'');calcF();$('ov').classList.add('on')}
const closeF=()=>$('ov').classList.remove('on');
async function saveF(){
 const m=st.mode,rec={season:$('f_season').value.trim(),name:$('f_name').value.trim(),no:$('f_no').value===''?NaN:+$('f_no').value,grade:$('f_grade').value};FLD[m].forEach(([k])=>rec[k]=fv(k));
 if(!rec.season||!rec.name||isNaN(rec.no)){toast('シーズン・選手名・背番号を入力してください');return}
 if(m=='b'&&rec.s1+rec.d2+rec.d3+rec.hr>rec.ab){toast('安打数が打数を超えています');return}
 if(m=='p'){const fr=Math.round((rec.ip-Math.floor(rec.ip+1e-9))*10);if(fr>2||Math.abs((rec.ip*10)-Math.round(rec.ip*10))>1e-6){toast('投球回の小数は .1 .2 で入力してください（例 3.2）');return}if(rec.er>rec.r){toast('自責点が失点を超えています');return}}
 $('f_save').disabled=true;
 try{await apiPost('upsert',{p:{...rec,orig:editKey,u:editKey?editKey.u:''}});st.season=rec.season;st.sel=rec.no;build();closeF();render();toast(editKey?'更新しました':'追加しました')}catch(e){}finally{$('f_save').disabled=false}}

$('tb').onclick=e=>{const b=e.target.closest('button');

  if(b.dataset.x&&confirm('この選手の記録（'+LB[st.mode]+'）を削除しますか？')){const o=RECS[st.mode].find(r=>r.season==st.season&&r.no==+b.dataset.x);apiPost('delete',{season:st.season,no:+b.dataset.x,u:o?o.u:''}).then(()=>toast('削除しました')).catch(()=>{})}return}

function logout(q){TOKEN='';TEXP=0;try{sessionStorage.removeItem('kt2');sessionStorage.removeItem('ke2')}catch(e){}setEdit(false);if(!q)toast('編集モードを終了しました')}

  if(r.ok){TOKEN=r.token;TEXP=r.exp;try{sessionStorage.setItem('kt2',TOKEN);sessionStorage.setItem('ke2',TEXP)}catch(e){}setEdit(true);closeL();toast('編集モードになりました');return}
  pm.textContent=r.error=='locked'?'失敗が続いたため、一時的にロックされています。しばらくしてからお試しください。':r.error=='notconfigured'?'合言葉が未設定です（管理者の設定が必要です）。':'合言葉が違います。'}
 catch(e){console.error(e);pm.textContent='通信に失敗しました。'}}
if(!API){$('lock').style.display='none';$('rf').style.display='none';$('sync').textContent=' ／ 連携未設定（埋め込みデータ）'}
else{try{TOKEN=sessionStorage.getItem('kt2')||'';TEXP=+sessionStorage.getItem('ke2')||0}catch(e){}if(TOKEN&&TEXP<Date.now())TOKEN='';setEdit(!!TOKEN);
