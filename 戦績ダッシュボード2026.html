<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>淵一少年野球部 2026 戦績ダッシュボード</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --primary: #0f766e;
        --primary-soft: #ccfbf1;
        --accent: #f59e0b;
        --line: #e5e7eb;
        --good: #16a34a;
        --bad: #dc2626;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        background: linear-gradient(135deg, var(--primary), #115e59);
        color: white;
        border-radius: 18px;
        padding: 26px 26px 18px;
        box-shadow: 0 12px 28px rgba(15, 118, 110, 0.15);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .subtitle {
        margin-top: 10px;
        opacity: 0.9;
        font-size: 1rem;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      }

      .label {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .value {
        font-size: clamp(1.8rem, 2vw, 2.3rem);
        font-weight: 700;
      }

      .value.good { color: var(--good); }
      .value.bad { color: var(--bad); }

      .section {
        margin-top: 28px;
      }

      .section h2 {
        margin: 0 0 14px;
        font-size: 1.3rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      th {
        background: #f8fafc;
      }

      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .pill.win {
        background: #dcfce7;
        color: #166534;
      }

      .pill.loss {
        background: #fee2e2;
        color: #991b1b;
      }

      .pill.draw {
        background: #fef3c7;
        color: #92400e;
      }

      .notes {
        line-height: 1.8;
        color: var(--ink);
      }

      @media (max-width: 640px) {
        .container {
          padding-left: 14px;
          padding-right: 14px;
        }

        th, td {
          font-size: 0.92rem;
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>淵一少年野球部</h1>
        <div class="subtitle">2026年度 戦績ダッシュボード</div>
      </header>

      <section class="summary-grid">
        <div class="card">
          <div class="label">試合数</div>
          <div class="value">0</div>
        </div>
        <div class="card">
          <div class="label">勝利</div>
          <div class="value good">0</div>
        </div>
        <div class="card">
          <div class="label">敗戦</div>
          <div class="value bad">0</div>
        </div>
        <div class="card">
          <div class="label">勝率</div>
          <div class="value">-.---</div>
        </div>
      </section>

      <section class="section">
        <h2>成績一覧</h2>
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>対戦相手</th>
              <th>結果</th>
              <th>スコア</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>—</td>
              <td>—</td>
              <td><span class="pill draw">未登録</span></td>
              <td>—</td>
              <td>データを追加してください</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="section">
        <h2>概要</h2>
        <div class="card notes">
          ここにチームの戦績・試合結果・大会成績・選手の成長状況・今後の目標などを記録できます。<br />
          2026年度の実績を追加していくことで、毎年の成長を見える化できます。
        </div>
      </section>
    </div>
  </body>
</html>
